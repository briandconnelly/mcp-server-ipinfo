[project]
name = "mcp-server-ipinfo"
version = "0.7.0"
description = "IP Geolocation Server for MCP"
readme = "README.md"
license = { file = "LICENSE" }

authors = [
    { name = "Brian Connelly", email = "bdc@bconnelly.net" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Networking",
]

requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.27.0",
    "ipinfo>=5.4.0",
    "pydantic>=2.10.6",
]

[project.optional-dependencies]
dev = [
    "prek>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.0",
    "time-machine>=2.16.0",
    "ty>=0.0.1a7",
]

[project.urls]
Repository = "https://github.com/briandconnelly/mcp-server-ipinfo.git"
Issues = "https://github.com/briandconnelly/mcp-server-ipinfo/issues"

[project.scripts]
mcp-server-ipinfo = "mcp_server_ipinfo.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["tests/smoke", "tests/smoke/**"]

[tool.ty.src]
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=mcp_server_ipinfo --cov-report=term-missing -m 'not smoke'"
markers = [
    "smoke: live-API smoke tests; require IPINFO_API_TOKEN; opt in with `pytest -m smoke --no-cov`",
]

[tool.coverage.run]
source = ["src/mcp_server_ipinfo"]

[tool.coverage.report]
fail_under = 95
show_missing = true
